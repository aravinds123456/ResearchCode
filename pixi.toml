[workspace]
name = "branching-hallucinations"
version = "0.1.0"
description = "Branching Hallucinations: verified-false seed → D/N/V tree → DROP/RETRACT/REPEAT/DEPEND"
authors = ["HalluHard Team"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.10,<3.13"
openai = ">=1.108.0"
python-dotenv = ">=1.1.1,<2"
ipykernel = ">=6.30.1,<7"
tiktoken = ">=0.11.0,<0.12"
arxiv = ">=2.2.0,<3"
pandas = ">=2.3.2,<3"
matplotlib = ">=3.10.6,<4"
seaborn = ">=0.13.2,<0.14"
beautifulsoup4 = ">=4.13.5,<5"
lxml = ">=6.0.2,<7"
aiohttp = ">=3.12.15,<4"
jinja2 = ">=3.1.6,<4"
datasets = ">=3.0.0,<4"
numpy = ">=1.26.0,<2"
lxml-html-clean = ">=0.4.3,<0.5"
markitdown = ">=0.1.3,<0.2"
ffmpeg = ">=8.0.0,<9"
httpx = ">=0.28.1,<0.29"
bs4 = ">=4.14.2,<5"
scikit-learn = ">=1.7.2,<2"
json5 = ">=0.12.1,<0.13"
pytorch = ">=2.10.0,<3"
transformers = ">=5.14.1,<6"
accelerate = ">=1.14.0,<2"

[pypi-dependencies]
anthropic = ">=0.40.0, <1"
pymupdf-layout = ">=1.26.6, <2"
pyalex = ">=0.19, <0.20"
selenium = ">=4.36.0, <5"
trafilatura = ">=2.0.0, <3"
pymupdf4llm = ">=0.2.2, <0.3"
google-genai = "*"
tomli = ">=2.0.0, <3"

[tasks]

report = "python halluhard/report.py"
branching-test = "python -m unittest discover -s tests/branching_hallucinations -p 'test_*.py'"
branching-pilot-init = "python -m branching_hallucinations init-run --config configs/branching_pilot.toml --run runs/pilot"

research-questions-data = "python -m halluhard.research_questions.data_fetcher"
research-questions-generate = "python -m halluhard.research_questions.generate_responses"
coding-data = "python -m halluhard.coding.data_fetcher"
coding-generate = "python -m halluhard.coding.generate_responses"
legal-cases-data = "python -m halluhard.legal_cases.data_fetcher"
legal-cases-generate = "python -m halluhard.legal_cases.generate_responses"
medical-guidelines-data = "python -m halluhard.medical_guidelines.data_fetcher"
medical-guidelines-generate = "python -m halluhard.medical_guidelines.generate_responses"
