[experiment]
n_seeds = 100
depth = 2
actions = ["D", "N", "V"]
random_seed = 42
# Loader round-robins Hard and Moderate so a 100-seed run is not Hard-only.
domains = ["hard", "moderate"]
max_claims_per_seed = 8
concurrency = 8
# Canned D/N/V questions are not used. true is rejected at config load.

[dataset]
name = "factbench"
path = "data/factbench/prompts.jsonl"
grounding_task = "research_questions"

[models.answer]
sampler = "azure-gpt-oss-20b"
max_tokens = 32768
reasoning_effort = "low"

[models.followup_writer]
sampler = "azure-gpt-5-mini"

[models.trajectory_judge]
sampler = "azure-gpt-5-mini"

[models.claim_extractor]
sampler = "azure-gpt-5-mini"

[models.grounded_verifier]
# Same gpt-5-mini deployment as the other mini roles; medium reasoning because
# this call is the scientific gate (only VERIFIED_FALSE seeds enter the tree).
sampler = "azure-gpt-5-mini-medium"

[models.search_planner]
sampler = "azure-gpt-5-mini"

[grounding]
method = "halluhard_webscraper"
max_searches = 3

[trajectory]
states = ["DROP", "RETRACT", "REPEAT", "DEPEND"]
